name: Download MOPS PDFs

# Add necessary permissions for release creation
permissions:
  contents: write
  actions: read

on:
  # Manual trigger with year and quarter parameters
  workflow_dispatch:
    inputs:
      company_id:
        description: 'Single company ID (4 digits). Leave empty for batch mode.'
        required: false
        type: string
        default: ''
      year_mode:
        description: 'Year mode: single year or all years in a range'
        required: false
        type: choice
        options:
          - 'single'
          - 'all'
        default: 'single'
      year:
        description: 'Year to download when year_mode=single (e.g., 2025)'
        required: false
        type: string
        default: '2025'
      start_year:
        description: 'Start year when year_mode=all (e.g., 2020)'
        required: false
        type: string
        default: '2020'
      end_year:
        description: 'End year when year_mode=all (default: current year)'
        required: false
        type: string
        default: ''
      quarter:
        description: 'Quarter to download (all, 1, 2, 3, or 4)'
        required: true
        type: choice
        options:
          - 'all'
          - '1'
          - '2'
          - '3'
          - '4'
        default: 'all'
      delay:
        description: 'Delay between downloads (seconds)'
        required: false
        type: string
        default: '10.0'
      start_from:
        description: 'Start from specific company ID (optional)'
        required: false
        type: string
        default: '2412'
      only_missing_files:
        description: 'Skip files that already exist locally (size > 100KB)'
        required: false
        type: boolean
        default: true
      upload_to_sheets:
        description: 'DISABLED: Google Sheets upload has been retired, matrix data lives in README.md now'
        required: false
        type: boolean
        default: false
      fail_on_partial_failure:
        description: 'Fail workflow if any year fails in single-company all-year mode'
        required: false
        type: boolean
        default: false
  
  # Scheduled trigger - Aligned with MOPS filing deadlines
  # Q4 (Oct-Dec): Deadline March 31 → Download March 31 - April 4
  # Q1 (Jan-Mar): Deadline May 15 → Download May 15-19
  # Q2 (Apr-Jun): Deadline Aug 14 → Download Aug 14-18
  # Q3 (Jul-Sep): Deadline Nov 14 → Download Nov 14-18
  #
  # The four daily blocks below only cover the deadline's own calendar month
  # (e.g. Q2's deadline is Aug 14, but the daily window stops Aug 31). Any
  # company that files even a few days late -- including holding
  # companies/banks, whose deadline is already a few weeks past the general
  # one -- falls into a months-long blind spot where nothing re-checks it
  # until the *next* quarter's daily window opens. The weekly cron below
  # closes that gap; it deliberately overlaps the daily windows too (running
  # scheduled downloads always use --only-missing-files, so an extra Monday
  # run during a daily-covered month is a no-op, not a duplicate download).
  schedule:
    # Q4 Season: Daily from March 15 to April 10 at 02:00 UTC (10:00 CST)
    - cron: '0 2 15-31 3 *'
    - cron: '0 2 1-10 4 *'

    # Q1 Season: Daily from May 1 to May 31 at 02:00 UTC
    - cron: '0 2 * 5 *'

    # Q2 Season: Daily from Aug 1 to Aug 31 at 02:00 UTC
    - cron: '0 2 * 8 *'

    # Q3 Season: Daily from Nov 1 to Nov 30 at 02:00 UTC
    - cron: '0 2 * 11 *'

    # Weekly catch-up: every Monday, year-round, to keep re-checking for late
    # filers between deadline months (see note above). The "Determine which
    # quarter" fallback logic already generalizes to any month, so this
    # needs no changes anywhere else in this workflow.
    - cron: '0 2 * * 1'

env:
  # Google Sheets credentials (add these to your repository secrets)
  GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
  GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

jobs:
  download-pdfs:
    runs-on: ubuntu-latest
    timeout-minutes: 480  # 8 hours timeout
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        token: ${{ secrets.REPO_FILE_SYNC_WENCHIEHLEE_INVESTMENT1 }}

    - name: Checkout skills repository
      uses: actions/checkout@v5
      with:
        repository: wenchiehlee/skills
        path: skills
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git
        # Set up environment for Unicode support
        export PYTHONIOENCODING=utf-8
        export LC_ALL=C.UTF-8
        export LANG=C.UTF-8
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        
        # Install required dependencies for mops_downloader
        pip install -r requirements.txt
        
        # Install the package in development mode (since it's in the same repo)
        # This will make the mops_downloader package importable
        pip install -e .
        
        # Install any additional requirements if they exist
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi
    
    - name: Verify installation and dependencies
      run: |
        # Verify mops_downloader can be imported
        python -c "import mops_downloader; print('✅ mops_downloader package imported successfully')"
        
        # Test maintained skill runner (with basic help check)
        python skills/common/skill-mops-fetch/scripts/run_mops_fetch.py --help || echo "Skill runner check completed"
        
        # Verify main components
        python -c "from mops_downloader.main import MOPSDownloader; print('✅ MOPSDownloader class imported successfully')"
        
        # Verify sheets uploader dependencies
        python -c "import pandas; print('✅ pandas imported successfully')"
        python -c "import gspread; print('✅ gspread imported successfully')" || echo "⚠️ gspread not available - sheets upload will be skipped"
    
    - name: Verify CSV file exists
      run: |
        if [ ! -f "StockID_TWSE_TPEX.csv" ]; then
          echo "Error: StockID_TWSE_TPEX.csv not found!"
          echo "Available files:"
          ls -la *.csv || echo "No CSV files found"
          exit 1
        fi
        echo "✅ CSV file found with $(wc -l < StockID_TWSE_TPEX.csv) lines"
    
    - name: Set up Git configuration
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
    
    - name: Create downloads and logs directories
      run: |
        mkdir -p downloads
        mkdir -p logs
        mkdir -p data/reports
        echo "✅ Created downloads, logs, and data/reports directories"
    
    - name: Download PDFs (Manual Trigger)
      if: github.event_name == 'workflow_dispatch'
      run: |
        # Set environment for Unicode support
        export PYTHONIOENCODING=utf-8
        export LC_ALL=C.UTF-8
        export LANG=C.UTF-8
        
        echo "🚀 Starting manual MOPS skill-driven download/convert..."
        echo "Company ID: ${{ inputs.company_id || 'BATCH_MODE' }}"
        echo "Year Mode: ${{ inputs.year_mode || 'single' }}"
        echo "Year: ${{ inputs.year }}"
        echo "Start Year: ${{ inputs.start_year }}"
        echo "End Year: ${{ inputs.end_year || 'current year' }}"
        echo "Quarter: ${{ inputs.quarter }}"
        echo "Delay: ${{ inputs.delay }}"
        echo "Start From: ${{ inputs.start_from || 'Beginning' }}"
        echo "Only Missing Files: ${{ inputs.only_missing_files }}"
        echo "Upload to Sheets: ${{ inputs.upload_to_sheets }}"
        echo "Fail On Partial Failure: ${{ inputs.fail_on_partial_failure }}"
        
        # Show skip behavior info
        if [ "${{ inputs.only_missing_files }}" == "true" ]; then
          echo "📥 Skip mode enabled: Will skip existing files > 100KB"
        else
          echo "🔄 Force download mode: Will re-download all files even if they exist"
        fi
        
        COMPANY_ID="$(echo "${{ inputs.company_id }}" | xargs)"
        YEAR_MODE="${{ inputs.year_mode || 'single' }}"
        QUARTER_INPUT="${{ inputs.quarter }}"
        YEAR_INPUT="${{ inputs.year }}"
        START_YEAR_INPUT="${{ inputs.start_year }}"
        END_YEAR_INPUT="${{ inputs.end_year }}"
        FAIL_ON_PARTIAL="${{ inputs.fail_on_partial_failure }}"
        ONLY_MISSING_FLAG=""
        if [ "${{ inputs.only_missing_files }}" == "true" ]; then
          ONLY_MISSING_FLAG="--only-missing-files"
        fi
        
        # Single-company mode
        if [ -n "$COMPANY_ID" ]; then
          echo "🎯 Running single-company mode for: $COMPANY_ID"
          
          if ! [[ "$COMPANY_ID" =~ ^[0-9]{4}$ ]]; then
            echo "❌ Invalid company_id: $COMPANY_ID (must be exactly 4 digits)"
            exit 1
          fi
          
          run_single_company_download() {
            local target_year="$1"
            local target_quarter="$2"
            local cmd=(python skills/common/skill-mops-fetch/scripts/run_mops_fetch.py "$COMPANY_ID" "$target_year")
            
            if [ "$target_quarter" = "all" ]; then
              cmd+=(all)
            else
              cmd+=("$target_quarter")
            fi
            
            if [ -n "$ONLY_MISSING_FLAG" ]; then
              cmd+=("$ONLY_MISSING_FLAG")
            fi
            
            echo "Running: ${cmd[*]}"
            "${cmd[@]}"
          }
          
          if [ "$YEAR_MODE" = "all" ]; then
            if ! [[ "$START_YEAR_INPUT" =~ ^[0-9]{4}$ ]]; then
              echo "❌ start_year must be a 4-digit year when year_mode=all"
              exit 1
            fi
            
            if [ -z "$END_YEAR_INPUT" ]; then
              END_YEAR_INPUT=$(date +%Y)
            elif ! [[ "$END_YEAR_INPUT" =~ ^[0-9]{4}$ ]]; then
              echo "❌ end_year must be empty or a 4-digit year"
              exit 1
            fi
            
            if [ "$START_YEAR_INPUT" -gt "$END_YEAR_INPUT" ]; then
              echo "❌ Invalid year range: start_year ($START_YEAR_INPUT) > end_year ($END_YEAR_INPUT)"
              exit 1
            fi
            
            echo "📅 Downloading company $COMPANY_ID for years $START_YEAR_INPUT to $END_YEAR_INPUT, quarter=$QUARTER_INPUT"
            FAILED_YEARS=0
            FAILED_YEAR_LIST=""
            
            for target_year in $(seq "$START_YEAR_INPUT" "$END_YEAR_INPUT"); do
              echo "----------------------------------------"
              echo "Year: $target_year"
              if ! run_single_company_download "$target_year" "$QUARTER_INPUT"; then
                echo "⚠️ Failed: company $COMPANY_ID, year $target_year"
                FAILED_YEARS=$((FAILED_YEARS + 1))
                if [ -z "$FAILED_YEAR_LIST" ]; then
                  FAILED_YEAR_LIST="$target_year"
                else
                  FAILED_YEAR_LIST="$FAILED_YEAR_LIST,$target_year"
                fi
              fi
            done
            
            if [ "$FAILED_YEARS" -gt 0 ]; then
              echo "⚠️ Single-company all-year run completed with $FAILED_YEARS failed years: $FAILED_YEAR_LIST"
              if [ "$FAIL_ON_PARTIAL" = "true" ]; then
                echo "❌ fail_on_partial_failure=true, exiting with failure"
                exit 1
              fi
              echo "✅ Continuing because fail_on_partial_failure=false"
            fi
            
            echo "✅ Single-company all-year run completed successfully"
          else
            if ! [[ "$YEAR_INPUT" =~ ^[0-9]{4}$ ]]; then
              echo "❌ year must be a 4-digit year when year_mode=single"
              exit 1
            fi
            
            run_single_company_download "$YEAR_INPUT" "$QUARTER_INPUT"
            echo "✅ Single-company single-year run completed successfully"
          fi
          
        # Batch mode (existing behavior)
        else
          # Build command arguments for DownloadAll.py (based on actual CLI interface)
          CMD_ARGS=""
          CMD_ARGS="$CMD_ARGS --year ${{ inputs.year }}"
          CMD_ARGS="$CMD_ARGS --delay ${{ inputs.delay }}"
          
          # Quarter is optional in DownloadAll.py; omit quarter when 'all'
          if [ "$QUARTER_INPUT" != "all" ]; then
            CMD_ARGS="$CMD_ARGS --quarter $QUARTER_INPUT"
          fi
          
          # Add start-from if provided (note: hyphen, not underscore)
          if [ -n "${{ inputs.start_from }}" ]; then
            CMD_ARGS="$CMD_ARGS --start-from ${{ inputs.start_from }}"
          fi
          
          # Add only-missing-files if enabled
          if [ "${{ inputs.only_missing_files }}" == "true" ]; then
            CMD_ARGS="$CMD_ARGS --only-missing-files"
          fi
          
          echo "Running: python DownloadAll.py $CMD_ARGS"
          python DownloadAll.py $CMD_ARGS || {
            echo "❌ DownloadAll.py failed, trying alternative approach..."
            
            # Fallback: Use individual CLI calls for a few companies as test
            echo "Testing individual downloads..."
            
            # Build CLI args for fallback
            SKILL_FLAGS=""
            if [ "${{ inputs.only_missing_files }}" == "true" ]; then
              SKILL_FLAGS="--only-missing-files"
              echo "📥 Fallback using skip mode: Will skip existing files > 100KB"
            else
              echo "🔄 Fallback using force download mode"
            fi
            
            head -5 StockID_TWSE_TPEX.csv | tail -n +2 | while IFS=, read -r company_id company_name exchange || [ -n "$company_id" ]; do
              if [ -n "$company_id" ]; then
                echo "Testing skill-driven download/convert for company: $company_id"
                python skills/common/skill-mops-fetch/scripts/run_mops_fetch.py "$company_id" "${{ inputs.year }}" "$QUARTER_INPUT" $SKILL_FLAGS || echo "Failed for company $company_id"
              fi
            done
          }
        fi
    
    - name: Download PDFs (Scheduled Trigger) 📅
      if: github.event_name == 'schedule'
      run: |
        # Set environment for Unicode support
        export PYTHONIOENCODING=utf-8
        export LC_ALL=C.UTF-8
        export LANG=C.UTF-8

        echo "================================================"
        echo "📅 Scheduled MOPS Skill Download/Convert (Aligned with Filing Deadlines)"
        echo "================================================"
        echo "📅 Current date: $(date)"
        echo ""

        # Single source of truth for "which quarter is due right now": the
        # most recently closed reporting quarter as of today. Used for BOTH
        # the daily in-season runs and the weekly year-round catch-up run
        # (see .github/workflows/Download.yaml's `schedule:` comments), so a
        # late filer is re-checked every week no matter how far past its
        # deadline month we are -- not just "quarter currently accumulating"
        # like the old MONTH_NUM range heuristic used to compute.
        FOCUS_JSON=$(python skills/common/skill-mops-fetch/scripts/filing_deadlines.py)
        echo "$FOCUS_JSON"
        eval "$(printf '%s' "$FOCUS_JSON" | python -c "
        import json, sys
        d = json.load(sys.stdin)
        print(f\"YEAR='{d['focus_year']}'\")
        print(f\"QUARTER='{d['focus_quarter']}'\")
        print(f\"QUARTER_NAME='Q{d['focus_quarter']} {d['focus_year']}'\")
        print(f\"DEADLINE_DATE='{d['deadline']}'\")
        print(f\"HOLDING_DEADLINE_DATE='{d['holding_deadline']}'\")
        print(f\"DAYS_SINCE_DEADLINE='{d['days_since_deadline']}'\")
        ")"

        echo "🎯 Target Quarter: $QUARTER_NAME"
        echo "📋 MOPS Filing Deadline: $DEADLINE_DATE (Holding companies: $HOLDING_DEADLINE_DATE) — $DAYS_SINCE_DEADLINE day(s) ago"
        echo "📥 Download mode: Skip existing files (only_missing_files=true)"
        echo "📊 Auto-upload to Google Sheets: Enabled"
        echo "================================================"
        echo ""

        # Run download with skip mode enabled (won't re-download existing files)
        python DownloadAll.py \
          --year $YEAR \
          --quarter $QUARTER \
          --delay 3.0 \
          --only-missing-files \
          || {
            echo ""
            echo "================================================"
            echo "❌ Download attempt failed for $QUARTER_NAME"
            echo "🔄 Retried again next scheduled run (daily in-season, weekly year-round)"
            echo "================================================"
            exit 1
          }

        echo ""
        echo "================================================"
        echo "✅ Download attempt completed for $QUARTER_NAME"
        echo "📊 Proceeding to matrix upload..."
        echo "================================================"
    
    - name: Check download results
      run: |
        echo "=== Download/Conversion Summary ==="
        echo "Current directory contents:"
        ls -la
        
        echo -e "\n=== Downloads directory structure ==="
        if [ -d "downloads" ]; then
          find downloads -type f \( -name "*.pdf" -o -name "*.md" \) | head -20
          echo -e "\nTotal PDF files found in downloads/:"
          find downloads -type f -name "*.pdf" | wc -l
          
          echo -e "\nCompany directories:"
          find downloads -type d -mindepth 1 | head -10
          
          echo -e "\nSample files per company:"
          find downloads -type d -mindepth 1 | head -5 | while read dir; do
            company=$(basename "$dir")
            count=$(find "$dir" -name "*.pdf" | wc -l)
            echo "  $company: $count PDF files"
            find "$dir" -name "*.pdf" | head -2 | sed 's/^/    /'
          done
        else
          echo "❌ No downloads directory found"
        fi
        
        echo -e "\n=== Logs directory ==="
        if [ -d "logs" ]; then
          ls -la logs/
          echo -e "\nLatest log file (last 20 lines):"
          find logs -name "*.log" -type f -exec tail -20 {} \; | tail -20
        else
          echo "❌ No logs directory found"
        fi
        
        echo -e "\n=== Disk usage ==="
        du -sh . 2>/dev/null || echo "Could not calculate disk usage"
        du -sh downloads/ 2>/dev/null || echo "Could not calculate downloads disk usage"

    - name: Upload matrix to Google Sheets
      if: false  # Disabled: matrix data is already published in README.md, Google Sheets mirror is no longer needed
      run: |
        echo "📊 Starting MOPS Sheets Uploader..."
        
        # Set environment for Unicode support
        export PYTHONIOENCODING=utf-8
        export LC_ALL=C.UTF-8
        export LANG=C.UTF-8
        
        # Check if required environment variables are available
        if [ -z "$GOOGLE_SHEETS_CREDENTIALS" ] || [ -z "$GOOGLE_SHEET_ID" ]; then
          echo "⚠️ Google Sheets credentials not configured"
          echo "   GOOGLE_SHEETS_CREDENTIALS: ${GOOGLE_SHEETS_CREDENTIALS:+SET}"
          echo "   GOOGLE_SHEET_ID: ${GOOGLE_SHEET_ID:+SET}"
          echo "   Skipping Google Sheets upload, will generate CSV backup only"
          
          # Run in CSV-only mode
          python scripts/sheets_uploader.py --csv-only --output data/reports/mops_matrix_$(date +%Y%m%d_%H%M%S).csv || {
            echo "❌ CSV-only upload failed, trying manual matrix generation..."
            
            # Fallback: Create a simple summary manually
            echo "Creating manual download summary..."
            SUMMARY_FILE="data/reports/matrix_summary_$(date +%Y%m%d_%H%M%S).csv"
            echo "代號,名稱,總報告數,最新季度" > "$SUMMARY_FILE"
            
            if [ -d "downloads" ]; then
              find downloads -type d -mindepth 1 | while read dir; do
                company=$(basename "$dir")
                count=$(find "$dir" -name "*.pdf" | wc -l)
                latest=$(find "$dir" -name "*.pdf" | sort | tail -1 | xargs basename 2>/dev/null || echo "無")
                echo "$company,待查詢,$count,$latest" >> "$SUMMARY_FILE"
              done
            fi
            
            echo "✅ Manual summary created: $SUMMARY_FILE"
          }
        else
          echo "✅ Google Sheets credentials configured"
          echo "📊 Uploading matrix to Google Sheets..."
          
          # Try to upload to Google Sheets with CSV fallback
          python scripts/sheets_uploader.py --upload || {
            echo "⚠️ Google Sheets upload failed, falling back to CSV only..."
            python scripts/sheets_uploader.py --csv-only --output data/reports/mops_matrix_$(date +%Y%m%d_%H%M%S).csv || {
              echo "❌ CSV fallback also failed"
              exit 0  # Don't fail the whole workflow
            }
          }
        fi
        
        echo "✅ Sheets uploader process completed"

    - name: Verify sheets upload results
      if: false  # Disabled: matrix data is already published in README.md, Google Sheets mirror is no longer needed
      run: |
        echo "=== Sheets Upload Verification ==="
        
        # Check for CSV output files
        if ls data/reports/mops_matrix_*.csv 1> /dev/null 2>&1; then
          echo "✅ CSV backup files found:"
          ls -la data/reports/mops_matrix_*.csv
          
          echo -e "\nCSV file preview (first 10 lines):"
          head -10 data/reports/mops_matrix_*.csv | head -10
        else
          echo "❌ No CSV backup files found"
        fi
        
        # Check for sheets uploader logs
        if ls logs/*sheets* 1> /dev/null 2>&1; then
          echo -e "\n📊 Sheets uploader logs:"
          ls -la logs/*sheets*
          
          echo -e "\nLatest sheets log (last 10 lines):"
          find logs -name "*sheets*" -type f -exec tail -10 {} \; | tail -10
        else
          echo "📊 No specific sheets uploader logs found"
        fi
        
        # Generate upload status report
        UPLOAD_STATUS_FILE="sheets_upload_status.txt"
        echo "Google Sheets Upload Status Report" > "$UPLOAD_STATUS_FILE"
        echo "Date: $(date)" >> "$UPLOAD_STATUS_FILE"
        echo "Trigger: ${{ github.event_name }}" >> "$UPLOAD_STATUS_FILE"
        echo "=================" >> "$UPLOAD_STATUS_FILE"
        
        if [ -n "$GOOGLE_SHEETS_CREDENTIALS" ] && [ -n "$GOOGLE_SHEET_ID" ]; then
          echo "✅ Credentials: Available" >> "$UPLOAD_STATUS_FILE"
          echo "📊 Sheet ID: ${GOOGLE_SHEET_ID}" >> "$UPLOAD_STATUS_FILE"
        else
          echo "❌ Credentials: Not configured" >> "$UPLOAD_STATUS_FILE"
        fi
        
        if ls data/reports/mops_matrix_*.csv 1> /dev/null 2>&1; then
          CSV_COUNT=$(ls data/reports/mops_matrix_*.csv | wc -l)
          echo "✅ CSV backups: $CSV_COUNT files created" >> "$UPLOAD_STATUS_FILE"
        else
          echo "❌ CSV backups: No files found" >> "$UPLOAD_STATUS_FILE"
        fi
        
        if [ -d "downloads" ]; then
          PDF_COUNT=$(find downloads -name "*.pdf" -type f | wc -l)
          COMPANY_COUNT=$(find downloads -type d -mindepth 1 | wc -l)
          echo "📥 Source data: $PDF_COUNT PDFs from $COMPANY_COUNT companies" >> "$UPLOAD_STATUS_FILE"
        else
          echo "❌ Source data: No downloads directory found" >> "$UPLOAD_STATUS_FILE"
        fi
        
        echo "✅ Upload status report created: $UPLOAD_STATUS_FILE"
    
    - name: Organize downloaded files (if needed)
      run: |
        # The skill-driven workflow writes downloads/{company_id}/*.pdf and same-stem *.md sidecars
        # No additional organization needed, but we can create a summary
        
        YEAR="${{ inputs.year || '2025' }}"
        QUARTER="${{ inputs.quarter || 'all' }}"
        ONLY_MISSING="${{ inputs.only_missing_files || 'true' }}"
        UPLOAD_SHEETS="${{ inputs.upload_to_sheets || 'true' }}"
        COMPANY_ID="$(echo "${{ inputs.company_id }}" | xargs)"
        YEAR_MODE="${{ inputs.year_mode || 'single' }}"
        
        if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "$YEAR_MODE" == "all" ]; then
          START_YEAR="${{ inputs.start_year }}"
          END_YEAR="${{ inputs.end_year }}"
          if [ -z "$END_YEAR" ]; then
            END_YEAR=$(date +%Y)
          fi
          YEAR="${START_YEAR}-${END_YEAR}"
        fi
        
        if [ "${{ github.event_name }}" == "schedule" ]; then
          # Same filing-focus computation as the download step above, so the
          # summary always matches what was actually just downloaded.
          eval "$(python skills/common/skill-mops-fetch/scripts/filing_deadlines.py | python -c "
          import json, sys
          d = json.load(sys.stdin)
          print(f\"YEAR='{d['focus_year']}'\")
          print(f\"QUARTER='{d['focus_quarter']}'\")
          ")"

          ONLY_MISSING="true"  # Scheduled runs always use skip mode
          UPLOAD_SHEETS="true" # Scheduled runs always upload to sheets
        fi
        
        # Create a comprehensive summary file
        SUMMARY_FILE="download_summary_${YEAR}_Q${QUARTER}.txt"
        echo "MOPS Download/Conversion Summary" > "$SUMMARY_FILE"
        echo "Year: $YEAR, Quarter: $QUARTER" >> "$SUMMARY_FILE"
        if [ -n "$COMPANY_ID" ]; then
          echo "Company ID: $COMPANY_ID (single-company mode)" >> "$SUMMARY_FILE"
        else
          echo "Company Scope: Batch mode (all companies)" >> "$SUMMARY_FILE"
        fi
        echo "Download Date: $(date)" >> "$SUMMARY_FILE"
        echo "Skip Existing Files: $ONLY_MISSING" >> "$SUMMARY_FILE"
        echo "Upload to Sheets: $UPLOAD_SHEETS" >> "$SUMMARY_FILE"
        echo "=================" >> "$SUMMARY_FILE"
        
        if [ -d "downloads" ]; then
          echo "Companies processed:" >> "$SUMMARY_FILE"
          find downloads -type d -mindepth 1 | while read dir; do
            company=$(basename "$dir")
            count=$(find "$dir" -name "*.pdf" | wc -l)
            echo "  $company: $count PDF files" >> "$SUMMARY_FILE"
          done
          
          total_files=$(find downloads -name "*.pdf" | wc -l)
          total_companies=$(find downloads -type d -mindepth 1 | wc -l)
          echo "" >> "$SUMMARY_FILE"
          total_md=$(find downloads -name "*.md" | wc -l)
          echo "Total: $total_files PDF files and $total_md Markdown files from $total_companies companies" >> "$SUMMARY_FILE"
        fi
        
        # Add sheets upload status to summary
        echo "" >> "$SUMMARY_FILE"
        echo "Google Sheets Upload:" >> "$SUMMARY_FILE"
        if [ "$UPLOAD_SHEETS" == "true" ]; then
          if [ -n "$GOOGLE_SHEETS_CREDENTIALS" ]; then
            echo "  Status: Attempted (check logs for results)" >> "$SUMMARY_FILE"
          else
            echo "  Status: Skipped (credentials not configured)" >> "$SUMMARY_FILE"
          fi
        else
          echo "  Status: Disabled by user" >> "$SUMMARY_FILE"
        fi
        
        if ls data/reports/mops_matrix_*.csv 1> /dev/null 2>&1; then
          CSV_COUNT=$(ls data/reports/mops_matrix_*.csv | wc -l)
          echo "  CSV Backup: $CSV_COUNT files created" >> "$SUMMARY_FILE"
        else
          echo "  CSV Backup: No files found" >> "$SUMMARY_FILE"
        fi
        
        echo "✅ Created download summary: $SUMMARY_FILE"

    - name: Convert downloaded PDFs to Markdown (text-only, no OCR)
      if: success()
      run: |
        # Runs on the hosted runner, which has no Tailscale connectivity to
        # the mac-mini-ocr API, so OCR is intentionally disabled here.
        # Pages that need OCR keep their TODO:OCR placeholder and are filled
        # in later via a manual `python scripts/batch_convert.py --retry-ocr`
        # run on a machine with Tailscale access to the Mac-mini OCR service.
        export PYTHONIOENCODING=utf-8
        export LC_ALL=C.UTF-8
        export LANG=C.UTF-8
        python scripts/batch_convert.py --no-ocr || echo "⚠️ batch_convert.py reported errors, continuing"

    - name: Commit downloaded MOPS files
      if: success()
      run: |
        echo "Committing downloaded MOPS files..."

        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

        # Add downloaded files and logs (exclude cache or temporary files)
        git add downloads/*.pdf downloads/*.md downloads/*/*.pdf downloads/*/*.md downloads/*/metadata.json || true
        git add logs/*.log || true
        git add download_summary_*.txt || true
        git add status_report.md || true
        git add sheets_upload_status.txt || true
        git add data/reports/mops_matrix_*.csv || true
        git add data/reports/batch_convert_failures.log || true

        # Auto-update README Current Download Status
        python scripts/update_readme_status.py && git add README.md || true

        # Generate MOPS health summary and latest matrix CSV
        python scripts/generate_mops_health.py && git add data/reports/mops_health_summary.csv data/reports/mops_matrix_latest.csv || true


        if git diff --staged --quiet; then
          echo "No MOPS download changes to commit"
        else
          # Determine commit message based on trigger type
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            COMPANY_ID="$(echo "${{ inputs.company_id }}" | xargs)"
            YEAR_MODE="${{ inputs.year_mode || 'single' }}"
            YEAR_LABEL="${{ inputs.year }}"
            QUARTER_LABEL="${{ inputs.quarter }}"
            
            if [ "$YEAR_MODE" == "all" ]; then
              START_YEAR="${{ inputs.start_year }}"
              END_YEAR="${{ inputs.end_year }}"
              if [ -z "$END_YEAR" ]; then
                END_YEAR=$(date +%Y)
              fi
              YEAR_LABEL="${START_YEAR}-${END_YEAR}"
            fi
            
            if [ "$QUARTER_LABEL" == "all" ]; then
              QUARTER_TEXT="All Quarters"
            else
              QUARTER_TEXT="Q${QUARTER_LABEL}"
            fi
            
            if [ "${{ inputs.only_missing_files }}" == "true" ]; then
              COMMIT_PREFIX="📥 MOPS PDFs Download (Skip Mode)"
            else
              COMMIT_PREFIX="🔄 MOPS PDFs Download (Force Mode)"
            fi
            
            if [ -n "$COMPANY_ID" ]; then
              COMMIT_MSG="${COMMIT_PREFIX} - Company ${COMPANY_ID} - ${YEAR_LABEL} ${QUARTER_TEXT}"
            else
              COMMIT_MSG="${COMMIT_PREFIX} - ${YEAR_LABEL} ${QUARTER_TEXT}"
            fi
            
            # Add sheets upload info to commit message
            if [ "${{ inputs.upload_to_sheets }}" == "true" ]; then
              COMMIT_MSG="${COMMIT_MSG} + 📊 Matrix Upload"
            fi
          else
            # For scheduled runs, use the same filing-focus computation as
            # the download step above (single source of truth).
            eval "$(python skills/common/skill-mops-fetch/scripts/filing_deadlines.py | python -c "
            import json, sys
            d = json.load(sys.stdin)
            print(f\"YEAR='{d['focus_year']}'\")
            print(f\"QUARTER='{d['focus_quarter']}'\")
            print(f\"DAYS_SINCE_DEADLINE='{d['days_since_deadline']}'\")
            ")"

            COMMIT_MSG="📥 Scheduled MOPS Download (${DAYS_SINCE_DEADLINE}d since deadline) + 📊 Matrix Upload - ${YEAR} Q${QUARTER}"
          fi
          
          # Count downloaded files for commit message
          if [ -d "downloads" ]; then
            PDF_COUNT=$(find downloads -name "*.pdf" -type f | wc -l)
            COMPANY_COUNT=$(find downloads -type d -mindepth 1 | wc -l)
            if [ "$PDF_COUNT" -gt 0 ]; then
              COMMIT_MSG="${COMMIT_MSG} (${PDF_COUNT} files from ${COMPANY_COUNT} companies)"
            else
              COMMIT_MSG="${COMMIT_MSG} (no PDFs downloaded)"
            fi
            
            # Add matrix info if CSV files exist
            if ls data/reports/mops_matrix_*.csv 1> /dev/null 2>&1; then
              CSV_COUNT=$(ls data/reports/mops_matrix_*.csv | wc -l)
              COMMIT_MSG="${COMMIT_MSG} + Matrix CSV (${CSV_COUNT} files)"
            fi
          else
            COMMIT_MSG="${COMMIT_MSG} (no downloads directory)"
          fi
          
          COMMIT_MSG="${COMMIT_MSG} - $(date +%Y-%m-%d\ %H:%M:%S)"
          
          git commit -m "$COMMIT_MSG" || true
          git push || true
          echo "✅ MOPS download results committed successfully"
        fi
    
    - name: Create release (for manual runs)
      if: github.event_name == 'workflow_dispatch' && success()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        COMPANY_ID="$(echo "${{ inputs.company_id }}" | xargs)"
        YEAR_MODE="${{ inputs.year_mode || 'single' }}"
        YEAR_LABEL="${{ inputs.year }}"
        QUARTER_LABEL="${{ inputs.quarter }}"
        
        if [ "$YEAR_MODE" == "all" ]; then
          START_YEAR="${{ inputs.start_year }}"
          END_YEAR="${{ inputs.end_year }}"
          if [ -z "$END_YEAR" ]; then
            END_YEAR=$(date +%Y)
          fi
          YEAR_LABEL="${START_YEAR}-${END_YEAR}"
        fi
        
        if [ "$QUARTER_LABEL" == "all" ]; then
          QUARTER_TAG="all-quarters"
          QUARTER_TITLE="All Quarters"
        else
          QUARTER_TAG="q${QUARTER_LABEL}"
          QUARTER_TITLE="Q${QUARTER_LABEL}"
        fi
        
        COMPANY_TAG=""
        if [ -n "$COMPANY_ID" ]; then
          COMPANY_TAG="-c${COMPANY_ID}"
        fi
        
        # Create release using GitHub CLI
        RELEASE_TAG="mops-${YEAR_LABEL}-${QUARTER_TAG}${COMPANY_TAG}-$(date +%Y%m%d-%H%M%S)"
        RELEASE_TITLE="MOPS PDFs ${YEAR_LABEL} ${QUARTER_TITLE}"
        if [ -n "$COMPANY_ID" ]; then
          RELEASE_TITLE="${RELEASE_TITLE} (Company ${COMPANY_ID})"
        fi
        
        # Count files for release description
        if [ -d "downloads" ]; then
          PDF_COUNT=$(find downloads -name "*.pdf" -type f | wc -l)
          COMPANY_COUNT=$(find downloads -type d -mindepth 1 | wc -l)
          RESULTS_TEXT="$PDF_COUNT PDF files downloaded from $COMPANY_COUNT companies"
        else
          RESULTS_TEXT="No downloads found"
        fi
        
        # Check matrix upload results
        MATRIX_RESULTS=""
        if [ "${{ inputs.upload_to_sheets }}" == "true" ]; then
          if [ -n "$GOOGLE_SHEETS_CREDENTIALS" ]; then
            MATRIX_RESULTS="Matrix uploaded to Google Sheets (check logs for status)"
          else
            MATRIX_RESULTS="Matrix upload skipped (credentials not configured)"
          fi
          
          if ls data/reports/mops_matrix_*.csv 1> /dev/null 2>&1; then
            CSV_COUNT=$(ls data/reports/mops_matrix_*.csv | wc -l)
            MATRIX_RESULTS="${MATRIX_RESULTS}. CSV backup: $CSV_COUNT files created"
          fi
        else
          MATRIX_RESULTS="Matrix upload disabled by user"
        fi
        
        # Create release notes file instead of variable
        cat > release_notes.md << 'EOF'
        ## Downloaded MOPS PDFs
        
        **Download Parameters:**
        - Company ID: ${{ inputs.company_id || 'Batch mode (all companies)' }}
        - Year Mode: ${{ inputs.year_mode || 'single' }}
        - Year: ${{ inputs.year }}
        - Start Year (year_mode=all): ${{ inputs.start_year }}
        - End Year (year_mode=all): ${{ inputs.end_year || 'current year' }}
        - Quarter: ${{ inputs.quarter }}
        - Delay: ${{ inputs.delay }}s
        - Start from: ${{ inputs.start_from || 'Beginning' }}
        - Skip existing files: ${{ inputs.only_missing_files }}
        - Upload to sheets: ${{ inputs.upload_to_sheets }}
        
        EOF
        
        # Append dynamic results
        echo "**Results:**" >> release_notes.md
        echo "- ${RESULTS_TEXT}" >> release_notes.md
        echo "- ${MATRIX_RESULTS}" >> release_notes.md
        echo "" >> release_notes.md
        echo "**Files:**" >> release_notes.md
        echo "- Check downloads/ directory for PDF files organized by company ID" >> release_notes.md
        echo "- Log files available in logs/ directory" >> release_notes.md
        echo "- Matrix CSV files available in data/reports/ directory" >> release_notes.md
        echo "" >> release_notes.md
        echo "**File Structure:**" >> release_notes.md
        echo '```' >> release_notes.md
        echo "downloads/{company_id}/YYYYQQ_{company_id}_AXX.pdf" >> release_notes.md
        echo "data/reports/mops_matrix_{timestamp}.csv" >> release_notes.md
        echo "logs/mops_downloader_{timestamp}.log" >> release_notes.md
        echo '```' >> release_notes.md
        
        # Try to create release using GitHub CLI
        if command -v gh &> /dev/null; then
          echo "Creating release using GitHub CLI..."
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TITLE" \
            --notes-file release_notes.md \
            --draft=false \
            --prerelease=false || echo "Failed to create release with gh CLI"
        else
          echo "GitHub CLI not available, creating simple tag..."
          git tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG" || echo "Failed to push tag"
        fi
  
    - name: Upload PDF artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mops-pdfs-${{ inputs.year || 'scheduled' }}-q${{ inputs.quarter || 'auto' }}
        path: |
          downloads/
          logs/
          data/reports/
          download_summary_*.txt
          sheets_upload_status.txt
        retention-days: 30
        if-no-files-found: warn
    
    - name: Create status report
      if: always()
      run: |
        echo "=== MOPS Download Status Report ===" > status_report.md
        echo "**Workflow:** ${{ github.workflow }}" >> status_report.md
        echo "**Trigger:** ${{ github.event_name }}" >> status_report.md
        echo "**Date:** $(date)" >> status_report.md
        echo "" >> status_report.md
        
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "**Parameters:**" >> status_report.md
          echo "- Company ID: ${{ inputs.company_id || 'Batch mode (all companies)' }}" >> status_report.md
          echo "- Year Mode: ${{ inputs.year_mode || 'single' }}" >> status_report.md
          echo "- Year: ${{ inputs.year }}" >> status_report.md
          echo "- Start Year (year_mode=all): ${{ inputs.start_year }}" >> status_report.md
          echo "- End Year (year_mode=all): ${{ inputs.end_year || 'current year' }}" >> status_report.md
          echo "- Quarter: ${{ inputs.quarter }}" >> status_report.md
          echo "- Delay: ${{ inputs.delay }}s" >> status_report.md
          echo "- Start From: ${{ inputs.start_from || 'Beginning' }}" >> status_report.md
          echo "- Skip Existing Files: ${{ inputs.only_missing_files }}" >> status_report.md
          echo "- Upload to Sheets: ${{ inputs.upload_to_sheets }}" >> status_report.md
          echo "- Fail On Partial Failure: ${{ inputs.fail_on_partial_failure }}" >> status_report.md
        else
          eval "$(python skills/common/skill-mops-fetch/scripts/filing_deadlines.py | python -c "
          import json, sys
          d = json.load(sys.stdin)
          print(f\"FOCUS_LABEL='{d['label']}'\")
          print(f\"DEADLINE_DATE='{d['deadline']}'\")
          print(f\"DAYS_SINCE_DEADLINE='{d['days_since_deadline']}'\")
          ")"

          echo "**Parameters:**" >> status_report.md
          echo "- Trigger: Scheduled (daily in-season, weekly year-round catch-up)" >> status_report.md
          echo "- Filing Focus Quarter: $FOCUS_LABEL (deadline $DEADLINE_DATE, ${DAYS_SINCE_DEADLINE}d ago)" >> status_report.md
          echo "- Skip Existing Files: true (default for scheduled runs)" >> status_report.md
          echo "- Upload to Sheets: true (default for scheduled runs)" >> status_report.md
          echo "" >> status_report.md
          echo "**MOPS Filing Deadlines:**" >> status_report.md
          echo "- Q1 (Jan-Mar): May 15" >> status_report.md
          echo "- Q2 (Apr-Jun): Aug 14" >> status_report.md
          echo "- Q3 (Jul-Sep): Nov 14" >> status_report.md
          echo "- Q4 (Oct-Dec): March 31 (next year)" >> status_report.md
        fi
        
        echo "" >> status_report.md
        echo "**Results:**" >> status_report.md
        
        if [ -d "downloads" ]; then
          PDF_COUNT=$(find downloads -name "*.pdf" -type f | wc -l)
          COMPANY_COUNT=$(find downloads -type d -mindepth 1 | wc -l)
          echo "- ✅ $PDF_COUNT PDF files downloaded" >> status_report.md
          echo "- ✅ $COMPANY_COUNT companies processed" >> status_report.md
        else
          echo "- ❌ No downloads directory found" >> status_report.md
        fi
        
        if [ -d "logs" ]; then
          LOG_COUNT=$(find logs -name "*.log" -type f | wc -l)
          echo "- ✅ $LOG_COUNT log files created" >> status_report.md
        else
          echo "- ❌ No logs directory found" >> status_report.md
        fi
        
        # Add sheets upload status
        echo "" >> status_report.md
        echo "**Google Sheets Upload:**" >> status_report.md
        if [ -n "$GOOGLE_SHEETS_CREDENTIALS" ] && [ -n "$GOOGLE_SHEET_ID" ]; then
          echo "- ✅ Credentials configured" >> status_report.md
          echo "- 📊 Matrix upload attempted (check logs for details)" >> status_report.md
        else
          echo "- ⚠️ Credentials not configured" >> status_report.md
          echo "- 📊 Matrix upload skipped" >> status_report.md
        fi
        
        if ls data/reports/mops_matrix_*.csv 1> /dev/null 2>&1; then
          CSV_COUNT=$(ls data/reports/mops_matrix_*.csv | wc -l)
          echo "- 💾 $CSV_COUNT CSV backup files created" >> status_report.md
        else
          echo "- ❌ No CSV backup files found" >> status_report.md
        fi
        
        echo "" >> status_report.md
        echo "**Job Status:** ${{ job.status }}" >> status_report.md
        
        cat status_report.md
