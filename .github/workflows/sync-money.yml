name: Sync to Money

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"  # Runs every 2 hours
  push:
    branches:
      - main
    paths:
      - "data/reports/mops_matrix_*.csv"
      - "raw_column_definition.md"
      - ".github/sync-money.yml"
      - ".github/workflows/sync-money.yml"

concurrency:
  group: sync-money
  cancel-in-progress: false

jobs:
